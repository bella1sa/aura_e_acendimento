<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura & Acendimento - Velas Aromáticas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="header">
        <div class="container header-container">
            <h1 class="logo">Aura & Acendimento</h1>
            <button class="btn-carrinho" onclick="abrirCarrinho()">
                Carrinho (<span id="cart-count">0</span>)
            </button>
        </div>
    </header>

    <section class="hero">
        <div class="container text-center">
            <h2>Transforme a energia do seu espaço</h2>
            <p>Velas 100% vegetais com essências marcantes para criar momentos de bem-estar e calmaria.</p>
            <a href="#catalogo" class="btn-principal">Conhecer Coleção</a>
        </div>
    </section>

    <main id="catalogo" class="container secao">
        <h3 class="titulo-secao">Nossos Aromas</h3>
        
        <div id="produtos-grid" class="grid-produtos">
            <p class="mensagem">A carregar velas...</p>
        </div>
    </main>

    
    <div id="modal-carrinho" class="modal-fundo" style="display: none;">
        <div class="modal-caixa">
            <button class="btn-fechar" onclick="fecharCarrinho()">&times;</button>
            <h3>Seu Carrinho</h3>
            
            <div id="carrinho-itens" class="lista-carrinho">
               
            </div>

            <div class="total-carrinho">
                <span>Total:</span>
                <span id="carrinho-total">R$ 0,00</span>
            </div>

            <form onsubmit="finalizarPedido(event)">
                <div class="campo-form">
                    <label for="cliente-nome">Nome Completo:</label>
                    <input type="text" id="cliente-nome" placeholder="Digite seu nome" required>
                </div>
                
                <div class="campo-form">
                    <label for="cliente-whatsapp">WhatsApp:</label>
                    <input type="tel" id="cliente-whatsapp" placeholder="Ex: 48999998888" required>
                </div>

                <button type="submit" class="btn-finalizar">Finalizar Pedido</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
